[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "synsync-bench"
version = "0.1.0"
description = "Controlled audio-visual manipulation benchmark with exact ground-truth sync offsets, plus a classical+learned fusion deepfake detector"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "opencv-python-headless>=4.8",
]

[project.scripts]
synsync-bench = "synsync.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["synsync*"]
